
name: Build Moon SI Analyzer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ICON="images/logo.ico"
            DATA_SEPARATOR=";"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ICON="images/logo.icns"
            DATA_SEPARATOR=":"
          else
            ICON="images/logo.png"
            DATA_SEPARATOR=":"
          fi

          python -m PyInstaller \
            --clean \
            --noconfirm \
            --onedir \
            --noconsole \
            --collect-all matplotlib \
            --collect-all scipy \
            --collect-all skrf \
            --collect-all PIL \
            --hidden-import PIL._tkinter_finder \
            --hidden-import matplotlib.backends.backend_tkagg \
            --name "Moon SI Analyzer" \
            --icon "$ICON" \
            --add-data "images/logo.png${DATA_SEPARATOR}images" \
            si_analyzer.py

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          tar -czf Moon-SI-Analyzer-Linux.tar.gz \
            -C dist "Moon SI Analyzer"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Moon-SI-Analyzer-${{ matrix.os }}
          path: |
            dist/
            Moon-SI-Analyzer-Linux.tar.gz
          if-no-files-found: error
          retention-days: 30
